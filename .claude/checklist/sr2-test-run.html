<title>SR2 Mods Test Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column of feature sections; each test is a row with Pass / Fail / Skip and a note. */
:root {
  --bg: #f3f6f2;
  --surface: #ffffff;
  --fg: #23302b;
  --muted: #5f6f68;
  --line: #d9e2dc;
  --accent: #d9468f;      /* pink plort */
  --accent-soft: #fbe3ef;
  --pass: #2f8f4e;
  --pass-soft: #dff2e5;
  --fail: #c2412d;
  --fail-soft: #fbe4df;
  --skip: #8a7a2e;
  --skip-soft: #f4efd6;
  --part: #b86a12;
  --part-soft: #f9e9d3;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151b19; --surface: #1d2522; --fg: #e6eee9; --muted: #9db0a7; --line: #2e3a35;
    --accent: #f06aa9; --accent-soft: #3a2230;
    --pass: #5cc77f; --pass-soft: #1e3527; --fail: #f07a66; --fail-soft: #3d231e;
    --skip: #d3bf63; --skip-soft: #353019;
    --part: #f0a24a; --part-soft: #3a2a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151b19; --surface: #1d2522; --fg: #e6eee9; --muted: #9db0a7; --line: #2e3a35;
  --accent: #f06aa9; --accent-soft: #3a2230;
  --pass: #5cc77f; --pass-soft: #1e3527; --fail: #f07a66; --fail-soft: #3d231e;
  --skip: #d3bf63; --skip-soft: #353019;
  --part: #f0a24a; --part-soft: #3a2a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.sub code { font-family: var(--font-mono); font-size: .9em; }
.summary {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { flex: 1 1 220px; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; min-width: 0; }
.bar span { display: block; height: 100%; }
.bar .q { background: var(--part); }
.bar .p { background: var(--pass); } .bar .f { background: var(--fail); } .bar .s { background: var(--skip); }
.counts { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-weight: 700; flex-wrap: wrap; }
.counts .c-q { color: var(--part); }
.counts .c-p { color: var(--pass); } .counts .c-f { color: var(--fail); } .counts .c-s { color: var(--skip); } .counts .c-o { color: var(--muted); }
.filter { display: flex; gap: 6px; }
.filter button, .st button {
  font: inherit; font-size: .85rem; font-weight: 700; border: 1px solid var(--line); background: transparent; color: var(--fg);
  border-radius: 99px; padding: 4px 12px; cursor: pointer;
}
.filter button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { font-size: .9rem; color: var(--muted); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; }
section { display: flex; flex-direction: column; gap: 8px; }
section h2 {
  font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 6px 0 0;
  display: flex; align-items: baseline; gap: 10px;
}
section h2 small { font-family: var(--font-body); font-weight: 600; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
section h2 button.fold {
  all: unset; cursor: pointer; display: flex; align-items: baseline; gap: 10px; border-radius: 6px;
}
section h2 button.fold:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
section h2 .chev { display: inline-block; width: 1em; font-size: .85em; color: var(--muted); }
/* A group (e.g. Skipped) holds its own sub-sections, indented under one fold. */
section.group > .kids { display: flex; flex-direction: column; gap: 14px; padding-left: 14px; border-left: 2px solid var(--line); }
section.group > .kids > section h2 { font-size: 1rem; }
.case {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line);
  border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px;
}
.case[data-status="pass"] { border-left-color: var(--pass); }
.case[data-status="fail"] { border-left-color: var(--fail); background: var(--fail-soft); }
.case[data-status="skip"] { border-left-color: var(--skip); }
.case[data-status="partial"] { border-left-color: var(--part); background: var(--part-soft); }
.st button[data-v="partial"][aria-pressed="true"] { background: var(--part); border-color: var(--part); color: #fff; }
.case .txt { min-width: 0; }
.case .t { font-weight: 700; }
.case .how { color: var(--muted); font-size: .9rem; margin-top: 2px; }
/* Steps: one action per line, numbered. */
.case ol.how { margin: 4px 0 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 2px; }
.case ol.how li::marker { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.case .id { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.st { display: flex; gap: 6px; align-items: flex-start; }
.st button[data-v="pass"][aria-pressed="true"] { background: var(--pass); border-color: var(--pass); color: #fff; }
.st button[data-v="fail"][aria-pressed="true"] { background: var(--fail); border-color: var(--fail); color: #fff; }
.st button[data-v="skip"][aria-pressed="true"] { background: var(--skip); border-color: var(--skip); color: #fff; }
.st .nb { border-style: dashed; color: var(--muted); }
.st .nb[aria-expanded="true"] { border-style: solid; color: var(--accent); border-color: var(--accent); }
.note { grid-column: 1 / -1; }
.last { margin-top: 6px; font-size: .85rem; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.last b { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.last .ls { font-weight: 700; }
.last .ls[data-s="fail"] { color: var(--fail); } .last .ls[data-s="partial"] { color: var(--part); } .last .ls[data-s="skip"] { color: var(--skip); }
.last p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.misc .last { margin: 0 12px 12px; max-height: 140px; overflow: auto; }
.note textarea {
  width: 100%; min-height: 54px; resize: vertical; font: inherit; font-size: .9rem; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
}
.note label { font-size: .8rem; color: var(--muted); font-weight: 700; display: block; margin-bottom: 2px; }
.misc {
  position: fixed; z-index: 20;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(340px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 6px 24px rgb(0 0 0 / .18); display: flex; flex-direction: column;
}
.misc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
.misc-head strong { font-family: var(--font-display); font-weight: 500; font-size: 1rem; }
.misc-head span { font-size: .8rem; color: var(--muted); }
.misc-head button { font: inherit; font-size: .8rem; font-weight: 700; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 99px; padding: 2px 10px; cursor: pointer; }
.misc textarea { margin: 0 12px 12px; min-height: 140px; resize: vertical; font: inherit; font-size: .9rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.misc[data-collapsed="true"] textarea { display: none; }
body { padding-bottom: 260px; }
@media (max-width: 520px) {
  .case { grid-template-columns: 1fr; }
  .st { justify-content: flex-start; }
}
@media (prefers-reduced-motion: no-preference) { .case { transition: background .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>SR2 Mods Test Run</h1>
    <p class="sub">Round 12: new and carried-over cases. Use the build whose Insert menu footer shows commit <code>78aeb0d</code> or later. Mark each case; use Note to write something down. Results save as you go, and Claude can read them.</p>
  </header>

  <div class="summary" aria-live="polite">
    <div class="counts">
      <span class="c-p" id="n-pass">0 pass</span>
      <span class="c-q" id="n-partial">0 partial</span>
      <span class="c-f" id="n-fail">0 fail</span>
      <span class="c-s" id="n-skip">0 skip</span>
      <span class="c-o" id="n-open">0 open</span>
    </div>
    <div class="bar" aria-hidden="true"><span class="p" id="b-p"></span><span class="q" id="b-q"></span><span class="f" id="b-f"></span><span class="s" id="b-s"></span></div>
    <div class="filter" role="group" aria-label="Show">
      <button type="button" id="f-all" aria-pressed="true">All</button>
      <button type="button" id="f-open" aria-pressed="false">Open</button>
      <button type="button" id="f-fail" aria-pressed="false">Failed</button>
    </div>
  </div>

  <div class="notice" id="store-note" hidden></div>
  <div id="list"></div>
</div>

<aside class="misc" id="misc" data-collapsed="false" aria-label="Other notes">
  <div class="misc-head">
    <strong>Other notes</strong>
    <span id="misc-state"></span>
    <button type="button" id="misc-toggle" aria-expanded="true">Hide</button>
  </div>
  <textarea id="misc-text" aria-label="Other notes" placeholder="Anything that doesn't fit a test case."></textarea>
  <div class="last" id="misc-last" hidden><b>Last notes</b><p id="misc-last-text"></p></div>
</aside>

<script>
const SECTIONS = [
  { name: "Main menu (no save loaded)", cases: [
    ["r12ml5", "Master switch off", ["Turn Custom Upgrades off: title dims; Tier effects and slot keys grey out.", "Sell back for half price and Drone station price limit still toggle.", "Load a save that uses custom upgrades: the header switch is locked on; hover says why."]],
  ]},
  { name: "Main menu -> load a save", cases: [
    ["r12pg4", "Per save", ["Load a save that doesn't own the upgrade: no [P] pill on any station.", "Load the save that owns it: the pill is back."]],
  ]},
  { name: "Menu only", cases: [
    ["r12ml4", "Ranch > Upgrades layout", ["Open Ranch: tabs read \"Upgrades\" and \"Slime DJ\".", "Upgrades: one Custom Upgrades card on the left with sections Plot upgrades (Tier effects), Sell upgrades (Sell back for half price), Refinery upgrades (note, Extra Tank III / IV keys, Drone station price limit).", "Toggle each switch: each works and dims while off.", "Misc > General: no Drone Price Limit card any more."]],
    ["r12ml6", "Search finds the sections", ["Ctrl+Space, type \"sell upgrades\": path reads Ranch > Upgrades > Custom Upgrades > Sell upgrades.", "Enter: the page opens and the row pulses.", "Same with \"drone price\"."]],
    ["r12lp5", "Lamp settings layout", ["Ranch > Slime DJ: \"Lamps pulse to the music\" and \"Lamp range\" right after \"Walls dance to the music\" / \"Dance intensity\".", "\"Lamp range\" hides while the switch is off."]],
  ]},
  { name: "Menu only (Sandbox on, save loaded)", cases: [
    ["r12ml1", "Grid tooltips don't flicker", ["Sandbox > Spawn & Craft: point at a spawner tile: tooltip appears.", "Move slowly across a row and down a column through the gaps: the tooltip moves tile to tile, never vanishes.", "Same in the Crafter grid, Vacpack slot row and picker, Upgrades blueprint tabs.", "Tile size and spacing look as before; section headings in place."]],
    ["r12ml2", "Upgrades entries hover", ["Sandbox > Upgrades > Upgrades: move across the gap between two entries: the highlight never drops out.", "- / + still work.", "Right-click an entry: its menu opens."]],
    ["r12ml3", "Keyboard still works on grids", ["Tab into a grid, arrows: focus moves tile by tile, ring around the tile (not the bigger cell).", "Tab again: focus leaves the grid.", "Menu key / Shift+F10 on a tile: context menu opens.", "Same on the vacpack slot row."]],
  ]},
  { name: "Ranch: anywhere", cases: [
    ["r12bd1", "Entity hitboxes show", ["Overlay > Misc > General > Developer tools: turn on \"Show entity hitboxes\", close the overlay: green / yellow / blue wireframes around nearby slimes, toys and gadgets.", "Walk up to a Slime Radio: a wireframe sphere plus a flat box at its bottom."]],
  ]},
  { name: "Ranch: anywhere (Sandbox on)", cases: [
    ["r12sb1", "Spawn a radiant slime", ["Sandbox > Spawn & Craft: right-click Pink Slime: a \"Spawn: Radiant Pink Slime\" entry.", "Click it: a glowing radiant Pink Slime appears in front of you.", "Vac it and shoot it out: still radiant.", "Save, quit to title, load: a radiant slime left on the ground is still radiant."]],
    ["r12sb2", "Radiant largos", ["Spawner > Largos: right-click a largo (e.g. Pink Tabby): up to two entries \"(radiant Pink)\" / \"(radiant Tabby)\".", "Click one: a radiant largo with that base's look spawns."]],
    ["r12sb3", "No radiant form / picker", ["Right-click a slime that may have no radiant form (Gold, Lucky, a Tarr): the entry is greyed with \"The game has no radiant form of this slime.\" (or available if it has one).", "Vacpack page: right-click a slime in the picker: \"Spawn: Radiant <slime>\" is listed too."]],
    ["r12nc1", "Noclip", ["Sandbox > General: a Noclip card under Newbucks (switch, key N, Fly up Space, Fly down Ctrl, speed 15 m/s, Shift 3x).", "Close the overlay, press N: \"Noclip on\", no falling.", "Look up, hold W: you fly where you look, through walls and ground.", "Hold Space, then Ctrl: straight up, then down.", "Shift + W: about 3x faster.", "Press N above ground: \"Noclip off\", you fall and land with collision."]],
    ["r12nc2", "Noclip with HL2 movement", ["HL2 movement on: noclip, fly 150 m+ straight down, wait, noclip off: you're not teleported back up.", "Bunny-hop afterwards: HL2 movement as usual."]],
    ["r12nc3", "Noclip restores", ["Noclip on, fly up, open the overlay and turn Sandbox off: you fall, collision works.", "Sandbox on, noclip on, open the map and press N or Space: nothing toggles or moves.", "Noclip on, pause (Esc): no movement while paused.", "Noclip on, take a teleporter to another zone: noclip ends, collision and gravity back.", "Rebind the noclip key: the new key toggles, N no longer does; speed 50 is noticeably faster."]],
  ]},
  { name: "Ranch: Fabricator", cases: [
    ["r12pg2", "Drone Program Scheduler card", ["Custom upgrades on, Drone Station blueprint owned: Fabricator > Upgrades shows \"Drone Program Scheduler\" with the Drone Station icon, 20,000 Newbucks plus refinery items.", "(New save without the Drone Station blueprint: the card isn't shown.)"]],
    ["r12pg3", "Buy it, programs come back", ["Buy Drone Program Scheduler: the card shows fully upgraded.", "Open a drone station: the [P] Programs pill is there.", "P > Add program works; the station from the old save shows its old programs again and they take turns."]],
    ["r12bd3", "Sharp card pictures", ["Decorations > DJ Booth: the details picture is the big Scientist Desk art tinted pink, sharp (may show the small icon for a moment the very first time).", "Slime Radio: sharp cyan Boombox art.", "DJ Speaker Stack: your stacked-radio drawing, sharp in the details and the tile.", "Select another card and come back to DJ Booth: the sharp picture shows at once.", "Warp Tech > Quantum Storage Link: sharp purple Refinery Link art."]],
    ["r12ic2", "Your DJ Booth drawing", ["Fabricator > Decorations > DJ Booth: the tile shows your booth drawing.", "The details picture shows it sharp (512 px copy)."]],
  ]},
  { name: "Ranch: open ground", cases: [
    ["r12dj1", "Booth silent while off", ["Fabricate and place a DJ Booth (starts off): no sound at all.", "Leave the zone and come back, or reload: still silent.", "E to switch it on with no slime and no song: the music box tune plays.", "E to switch it off: silent."]],
    ["r12dj2", "Every booth speaker plays, louder", ["Queue a song in the Slime DJ tab.", "Put a slime on the pillow behind the booth, switch it on.", "Walk from the left floor speaker past the desk to the right one: music from both floor speakers and the desk speakers; louder than one corral music box."]],
    ["r12dj3", "A Tarr as the DJ", ["Throw or carry a Tarr onto the pillow behind a switched-on booth: it sits.", "Queue a song: the booth plays the Slime DJ song."]],
    ["r12dj5", "Switched-off booth doesn't play or boost", ["Amplify on, a song playing from a nearby music box or stacks; place a booth and leave it off.", "Walk up to the booth: no music from it; other speakers sound the same as before.", "Switch it on with a slime seated: it joins in sync within a moment."]],
    ["r12lp3", "Lamps by booth, stack, radio", ["Lamp next to a switched-off DJ Booth while a song plays from a corral 20 m+ away: no pulse.", "Switch the booth on with a slime seated: the lamp pulses.", "Repeat with a speaker stack on, and a Slime Radio next to a lamp: pulses each time."]],
  ]},
  { name: "Ranch: open ground with Slime Radios", cases: [
    ["r12bd4", "Bigger radio that rolls and rights itself", ["Fabricate a Slime Radio: about twice as big as before, upright on its base.", "Push or shoot it from the side: it rolls or tips, then rocks back upright; no long slide.", "Vac it, hold 3 s, shoot it out: stays in the nozzle while held, lands and rights itself.", "Drop it on a slope: may roll a little, then settles."]],
  ]},
  { name: "Ranch: placed Quantum Storage Link", cases: [
    ["r12bd5", "No stray [SPACE] hint", ["E on the link: the Quantum Cloud menu opens with no \"[SPACE] + magnifying glass\" row (a back / close hint may stay).", "Close it, open a real Drone Station's Quantum Cloud tab: withdraw / send hints and keys still work."]],
  ]},
  { name: "Ranch: corral", cases: [
    ["r12cr1", "Button in the opposite corner, game notifications", ["Buy the Music Box and the Corral Radio: the blue button stands at the corner below the Music Box speaker, diagonally opposite the auto-feeder corner.", "Switch Slime DJ off, press the button: a game notification \"Corral Radio: Slime DJ is off ...\"; no floating text.", "On a coop with the Hen Collector, press its button: result as a game notification."]],
    ["r12cr2", "Music Box buy / sell with the radio", ["Corral with Music Box and Corral Radio, no Music Box II: the Music Box card shows Purchase (Music Box II) and an active \"Sell +N\".", "Purchase: Music Box II is bought.", "Sell Music Box II: the card shows Purchase plus \"Sell +N\" again.", "Change zone or teleport, come back, open the menu: Sell is still there.", "Sell the Music Box with the radio owned: it sells; the Corral Radio card stays listed and sellable.", "Buy the Music Box back: the radio plays its playlist again."]],
    ["r12cr3", "Game-styled radio menu", ["Press the blue button: Radio / Shuffle / Clear top right as game-style buttons; no key hints, no Done / Play / Up / Down / Remove row.", "Hover song rows: the row lights up and shows \"+ Add\"; click adds it (green note).", "Click a playlist entry: it plays (pink, \">\").", "Entry's up / down / remove buttons work; up greyed on the first row, down on the last.", "Radio, Shuffle, Clear twice: labels change, second Clear empties the list.", "Esc closes; reopen and click the dark backdrop: closes, game unpauses.", "Keyboard only (arrows, Tab, Enter, Del, Shift+Up/Down, R, F) still works."]],
  ]},
  { name: "Ranch: corral with a Music Box", cases: [
    ["r12dj4", "No crackle with Amplify", ["Amplify on, Slime DJ volume 100 %, game music volume max.", "Place 4-5 DJ Speaker Stacks and a booth near the corral, all on.", "Play a loud hardstyle / hardtekk song among the speakers: clean, no crackle; still surround."]],
    ["r12dj7", "Speakers inside boost the walls", ["Walls dance on, a song playing: watch the walls.", "Place two DJ Speaker Stacks or Slime Radios inside the corral, stacks on: walls move noticeably harder.", "Switch the stacks off: back to normal."]],
    ["r12lp1", "Electric Pillar Lamp pulses", ["Place an Electric Pillar Lamp ~5 m from a corral with a Music Box.", "Ranch > Slime DJ: \"Lamps pulse to the music\" on; play a song with a strong beat: within ~4 s the lamp's glow and lightning flash on beats and shift colour.", "Quiet part: the lamp is nearly its normal look.", "Pause: back to exactly its normal look. Play, then Stop: normal again."]],
    ["r12lp2", "Lamp range and setting", ["While a song plays, place a second lamp ~30 m from every speaker: it doesn't pulse.", "\"Lamp range\" 40 m: within ~4 s it pulses, weakly. Back to 20 m: normal within ~2 s.", "Switch \"Lamps pulse to the music\" off: lamps normal at once; on: pulse again within ~2 s."]],
  ]},
  { name: "Ranch: corral with Corral Radio and Music Box", cases: [
    ["r12dj6", "Walls follow the corral's radio", ["Walls dance on; put songs in the radio playlist, radio on, stop the global queue.", "Stand next to the corral: walls ripple and glow to the radio's song.", "Play a different global song with a second corral nearby (no radio): each corral follows its own song."]],
    ["r12lp4", "Lamp follows the corral radio", ["Lamp next to a corral whose radio plays its own playlist, global queue playing a different song elsewhere: the lamp follows the radio's beat.", "Switch the radio off: the lamp returns to normal."]],
  ]},
  { name: "Ranch: silo", cases: [
    ["r12bd2", "Sell-All Button icon", ["Open a silo's plot upgrade menu.", "The Sell-All Button card shows the Market Link icon, not Silo Capacity's."]],
    ["r12gb1", "Receipt buttons react like the game's", ["Empty the silo, press Sell-All: Sell is grey (no hover); Cancel turns blue and bounces on hover and shows C.", "Put plorts in, press Sell-All: Sell is pink, turns blue and bounces on hover, shows the confirm key.", "Click Sell: plorts sold, receipt closes.", "Open again, press C: closes without selling. Open again, press Enter: sells."]],
  ]},
  { name: "Ranch: drone station", cases: [
    ["r12pg1", "Old save without the upgrade", ["Load a save where a station already had 2+ programs: it runs program 1 only.", "Open its menu, Programming page: no [P] Programs pill; P does nothing.", "Wait a few minutes: the drone never switches programs."]],
    ["r12gb2", "Station pills as game buttons", ["(Drone Program Scheduler owned) Programming page: [P] Programs is a pink pill with a P key cap right of the target's Change; blue + bounce on hover.", "Destination Plort Market: [C] Limit appears in the same style.", "Click [C] Limit: the two \"Limit by\" buttons and Close are pink game buttons, selected mode teal, Close shows C.", "Click the other mode: it turns teal, the first pink. Close closes."]],
    ["r12gb3", "Programs dialog buttons", ["Press P: Edit / Running, Remove, Add program, mode buttons, Close [P] are pink game buttons; Running and the chosen mode teal; all react to hover.", "Arrow keys: the teal focus frame fits each button.", "Enter on Add program: program added, pill reads \"Program 2/2\".", "Edit on program 1: the page shows program 1. \"After each delivery\" turns teal. Remove: one row fewer.", "P or Esc: the dialog closes without closing the station menu."]],

const ALL = SECTIONS.flatMap(s => s.cases.map(c => c[0]));
const state = {};           // id -> {status, note}
let filter = "all";
const openNotes = new Set(); // cases whose note box the viewer opened
let db = null;
let canWrite = true;
const LS_KEY = "sr2-test-run-v1";

function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {} }

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v);
  }
  kids.forEach(k => k && e.appendChild(k));
  return e;
}

const COLLAPSE_KEY = "sr2-test-run-collapsed";
const collapsed = new Set((() => { try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "[]"); } catch { return []; } })());
function saveCollapsed() { try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed])); } catch {} }

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  const passes = id => {
    const st = state[id]?.status || "";
    return filter === "all" || (filter === "open" && !st) || (filter === "fail" && st === "fail");
  };
  const makeFold = (key, label, done, total) => {
    const closed = collapsed.has(key);
    const fold = el("button", { type: "button", class: "fold", "aria-expanded": String(!closed) },
      el("span", { class: "chev", "aria-hidden": "true", text: closed ? "▸" : "▾" }),
      document.createTextNode(label), el("small", { text: `${done}/${total}` }));
    fold.addEventListener("click", () => { if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key); saveCollapsed(); render(); });
    return fold;
  };
  const groups = {};  // group name -> its .kids container (null while folded)
  for (const s of SECTIONS) {
    const shown = s.cases.filter(([id]) => passes(id));
    if (!shown.length) continue;
    let parent = list;
    const key = s.group ? `${s.group}/${s.name}` : s.name;
    if (s.group) {
      if (!(s.group in groups)) {
        const members = SECTIONS.filter(x => x.group === s.group).flatMap(x => x.cases);
        const gkey = `group:${s.group}`;
        const gsec = el("section", { class: "group" },
          el("h2", {}, makeFold(gkey, s.group, members.filter(([id]) => state[id]?.status).length, members.length)));
        list.appendChild(gsec);
        groups[s.group] = collapsed.has(gkey) ? null : gsec.appendChild(el("div", { class: "kids" }));
      }
      parent = groups[s.group];
      if (!parent) continue;
    }
    const done = s.cases.filter(([id]) => state[id]?.status).length;
    const closed = collapsed.has(key);
    const sec = el("section", {}, el("h2", {}, makeFold(key, s.name, done, s.cases.length)));
    if (closed) { parent.appendChild(sec); continue; }
    for (const [id, title, how] of shown) {
      const cur = state[id] || {};
      const card = el("div", { class: "case", "data-status": cur.status || "" });
      const txt = el("div", { class: "txt" },
        el("div", { class: "t", text: title }),
        Array.isArray(how)
          ? el("ol", { class: "how" }, ...how.map(step => el("li", { text: step })))
          : el("div", { class: "how", text: how }),
        el("div", { class: "id", text: id }));
      if (cur.lastStatus || cur.lastNote) {
        const names = { fail: "Failed", partial: "Partial", skip: "Skipped", pass: "Passed" };
        const box = el("div", { class: "last" }, el("b", { text: "Last feedback" }));
        if (cur.lastStatus) box.appendChild(el("span", { class: "ls", "data-s": cur.lastStatus, text: names[cur.lastStatus] || cur.lastStatus }));
        if (cur.lastNote) box.appendChild(el("p", { text: cur.lastNote }));
        txt.appendChild(box);
      }
      const st = el("div", { class: "st", role: "group", "aria-label": `Result for ${title}` });
      for (const [v, label] of [["pass", "Pass"], ["partial", "Partial"], ["fail", "Fail"], ["skip", "Skip"]]) {
        const b = el("button", { type: "button", "data-v": v, "aria-pressed": String(cur.status === v), text: label });
        if (!canWrite) b.disabled = true;
        b.addEventListener("click", () => setStatus(id, cur.status === v ? "" : v));
        st.appendChild(b);
      }
      const noteOpen = cur.status === "fail" || cur.status === "partial" || !!cur.note || openNotes.has(id);
      const nb = el("button", { type: "button", class: "nb", "aria-expanded": String(noteOpen), text: cur.note ? "Note ✓" : "Note" });
      if (!canWrite && !cur.note) nb.disabled = true;
      nb.addEventListener("click", () => {
        if (openNotes.has(id)) openNotes.delete(id); else openNotes.add(id);
        render();
        if (openNotes.has(id)) document.getElementById(`note-${id}`)?.focus();
      });
      st.appendChild(nb);
      card.append(txt, st);
      if (noteOpen) {
        const ta = el("textarea", { id: `note-${id}`, placeholder: cur.status === "fail" ? "What went wrong?" : "Anything worth noting?" });
        ta.value = cur.note || "";
        if (!canWrite) ta.disabled = true;
        let t;
        ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => setNote(id, ta.value), 700); });
        ta.addEventListener("blur", () => { clearTimeout(t); if ((state[id]?.note || "") !== ta.value) setNote(id, ta.value); });
        card.appendChild(el("div", { class: "note" }, el("label", { for: `note-${id}`, text: "Note" }), ta));
      }
      sec.appendChild(card);
    }
    parent.appendChild(sec);
  }
  summary();
}

function summary() {
  const n = { pass: 0, partial: 0, fail: 0, skip: 0 };
  ALL.forEach(id => { const s = state[id]?.status; if (n[s] !== undefined) n[s]++; });
  const open = ALL.length - n.pass - n.partial - n.fail - n.skip;
  document.getElementById("n-partial").textContent = `${n.partial} partial`;
  document.getElementById("b-q").style.width = (100 * n.partial / ALL.length) + "%";
  document.getElementById("n-pass").textContent = `${n.pass} pass`;
  document.getElementById("n-fail").textContent = `${n.fail} fail`;
  document.getElementById("n-skip").textContent = `${n.skip} skip`;
  document.getElementById("n-open").textContent = `${open} open`;
  const pct = k => (100 * n[k] / ALL.length) + "%";
  document.getElementById("b-p").style.width = pct("pass");
  document.getElementById("b-f").style.width = pct("fail");
  document.getElementById("b-s").style.width = pct("skip");
}

async function write(id) {
  lsSave();
  if (!db) return;
  const cur = state[id] || {};
  try {
    await db.collection("results").doc(id).set({ status: cur.status || "", note: cur.note || "", lastStatus: cur.lastStatus || "", lastNote: cur.lastNote || "", updatedAt: new Date().toISOString() });
  } catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; showNote("You can view these results but not change them."); render(); }
    else showNote("Couldn't save the last change to the shared results. It is kept in this browser.");
  }
}

function setStatus(id, v) {
  state[id] = { ...(state[id] || {}), status: v };
  render();
  write(id);
}
function setNote(id, text) {
  state[id] = { ...(state[id] || {}), note: text };
  write(id);
}
function showNote(msg) { const n = document.getElementById("store-note"); n.textContent = msg; n.hidden = false; }

for (const [bid, f] of [["f-all", "all"], ["f-open", "open"], ["f-fail", "fail"]]) {
  document.getElementById(bid).addEventListener("click", () => {
    filter = f;
    document.querySelectorAll(".filter button").forEach(b => b.setAttribute("aria-pressed", String(b.id === bid)));
    render();
  });
}

Object.assign(state, lsLoad());
render();

// Other notes: one free-text document, saved like the case notes.
const miscTa = document.getElementById("misc-text");
const miscState = document.getElementById("misc-state");
const MISC_LS = "sr2-test-run-misc";
try { miscTa.value = localStorage.getItem(MISC_LS) || ""; } catch {}
let miscTimer, miscSaved = miscTa.value, miscLast = "";
function showMiscLast(t) {
  miscLast = t || "";
  document.getElementById("misc-last-text").textContent = miscLast;
  document.getElementById("misc-last").hidden = !miscLast;
}
async function saveMisc() {
  const v = miscTa.value;
  if (v === miscSaved) return;
  miscSaved = v;
  try { localStorage.setItem(MISC_LS, v); } catch {}
  if (!db) { miscState.textContent = "saved in this browser"; return; }
  try { await db.doc("misc/notes").set({ text: v, lastText: miscLast, updatedAt: new Date().toISOString() }); miscState.textContent = "saved"; }
  catch { miscState.textContent = "not saved"; }
}
miscTa.addEventListener("input", () => { miscState.textContent = ""; clearTimeout(miscTimer); miscTimer = setTimeout(saveMisc, 700); });
miscTa.addEventListener("blur", () => { clearTimeout(miscTimer); saveMisc(); });
document.getElementById("misc-toggle").addEventListener("click", e => {
  const box = document.getElementById("misc");
  const collapse = box.dataset.collapsed !== "true";
  box.dataset.collapsed = String(collapse);
  e.currentTarget.textContent = collapse ? "Show" : "Hide";
  e.currentTarget.setAttribute("aria-expanded", String(!collapse));
});

(async () => {
  try {
    db = window.claude ? await window.claude.use("db") : null;
  } catch { db = null; }
  if (!db) { showNote("Results are saved in this browser only, so Claude can't read them. Tell Claude what failed."); return; }
  db.doc("misc/notes").onSnapshot(d => {
    if (!d.exists) return;
    showMiscLast((d.data() || {}).lastText || "");
    if (document.activeElement === miscTa) return;
    const t = (d.data() || {}).text || "";
    if (t !== miscTa.value) { miscTa.value = t; miscSaved = t; try { localStorage.setItem(MISC_LS, t); } catch {} }
  });
  db.collection("results").onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs) {
      const v = d.data() || {};
      const cur = state[d.id] || {};
      if (cur.status !== (v.status || "") || (cur.note || "") !== (v.note || "") || (cur.lastStatus || "") !== (v.lastStatus || "") || (cur.lastNote || "") !== (v.lastNote || "")) {
        const focused = document.activeElement && document.activeElement.id === `note-${d.id}`;
        state[d.id] = { status: v.status || "", note: focused ? cur.note : (v.note || ""), lastStatus: v.lastStatus || "", lastNote: v.lastNote || "" };
        changed = true;
      }
    }
    if (changed) { lsSave(); if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") render(); else summary(); }
  }, () => showNote("Live sync stopped. Reload the page to reconnect."));
})();
</script>
